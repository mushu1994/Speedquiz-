<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1D45">
<title>Joyeux anniversaire Papa ! Le grand quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0E1D45;
  --ink-2: #172B63;
  --paper: #FFF7E4;
  --sun: #FFC93C;
  --sun-edge: #C98F00;
  --good: #35D08A;
  --bad: #FF6B57;
  --muted: #AEB9DA;
  --display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; font-family: var(--body); -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(900px 500px at 50% -10%, #2547A8 0%, transparent 62%), radial-gradient(600px 400px at 100% 100%, rgba(255, 201, 60, 0.13), transparent 60%), var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100%; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }

/* Le viseur : quatre coins, l'indicateur REC et la date, comme sur un caméscope. */
.vf { position: relative; width: min(100%, 560px); padding: 52px 22px 24px; }
.vf::before, .vf::after, .vf i, .vf b { content: ""; position: absolute; width: 28px; height: 28px; border: 0 solid rgba(255, 247, 228, 0.85); pointer-events: none; }
.vf::before { left: 0; top: 0; border-left-width: 3px; border-top-width: 3px; }
.vf::after { right: 0; top: 0; border-right-width: 3px; border-top-width: 3px; }
.vf i { left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px; }
.vf b { right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px; }
.hud { position: absolute; left: 22px; right: 22px; top: 14px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em; color: var(--paper); }
.rec { display: inline-flex; gap: 8px; align-items: center; }
.rec::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }

h1, h2 { font-family: var(--display); margin: 0; line-height: 1.04; letter-spacing: -0.015em; }
h1 { font-size: clamp(38px, 11vw, 60px); font-weight: 800; }
h2 { font-size: clamp(25px, 6.6vw, 33px); font-weight: 800; }
.lead { font-size: 19px; line-height: 1.45; color: #E3E9FB; margin: 16px 0 0; max-width: 34ch; }
.from { margin: 22px 0 0; color: var(--muted); font-size: 16px; }

.btn { display: block; width: 100%; min-height: 62px; margin-top: 26px; padding: 14px 18px; border: 0; border-radius: 18px; background: var(--sun); color: #2A1A00; font-family: var(--display); font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 var(--sun-edge); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-edge); }
.bar { display: flex; gap: 10px; margin: 0 0 12px; padding: 8px 0 10px; position: sticky; top: 0; z-index: 30; background: linear-gradient(#0e1d45 70%, rgba(14, 29, 69, 0)); }
.mini { flex: 0 1 auto; min-height: 46px; padding: 8px 14px; border: 2px solid rgba(255, 247, 228, 0.6); border-radius: 14px; background: rgba(14, 29, 69, 0.55); color: #fff; font-family: var(--display); font-weight: 800; font-size: 15px; white-space: nowrap; }
.btn.quiet { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 247, 228, 0.6); }
.btn.quiet:active { transform: none; background: rgba(255, 255, 255, 0.08); }

[hidden] { display: none !important; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; color: var(--paper); font-weight: 700; font-size: 17px; }
.tape { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 20px; }
.tape span { height: 8px; border-radius: 4px; background: rgba(255, 247, 228, 0.22); }
.tape span.on { background: var(--paper); }
.tape span.ok { background: var(--good); }
.tape span.ko { background: var(--bad); }

.q { background: var(--paper); color: #1A2350; border-radius: 22px; padding: 22px 20px; }
.q p { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(23px, 6.4vw, 30px); line-height: 1.18; }

.opts { display: grid; gap: 12px; margin-top: 16px; }
.opt { text-align: left; min-height: 64px; padding: 14px 18px; border: 2px solid rgba(255, 247, 228, 0.5); border-radius: 18px; background: var(--ink-2); font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
.opt .k { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 247, 228, 0.16); font-family: var(--display); font-size: 18px; }
.opt:active:not(:disabled) { background: #20387F; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--good); border-color: var(--good); color: #052E1B; }
.opt.right .k { background: rgba(5, 46, 27, 0.18); }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #3A0B03; }
.opt.wrong .k { background: rgba(58, 11, 3, 0.18); }
.opt.dim { opacity: 0.5; }
.opt.sel { background: #2B4DB3; border-color: var(--sun); }
.opt.sel .k { background: var(--sun); color: #2A1A00; }
.opt.right.sel .k, .opt.wrong.sel .k { color: inherit; }
.shot { margin: 16px 0 0; }
.shot img { display: block; width: 100%; max-height: 52vh; object-fit: cover; object-position: 50% 30%; border-radius: 14px; border: 3px solid var(--paper); background: #000; }
.shot figcaption { margin-top: 8px; font-size: 16px; color: var(--muted); }
.hint { margin: 14px 2px 0; color: var(--sun); font-weight: 700; font-size: 18px; }
.btn:disabled { background: rgba(255, 247, 228, 0.18); color: rgba(255, 247, 228, 0.55); box-shadow: none; cursor: default; }

.fb { margin-top: 18px; padding: 16px 18px; border-radius: 18px; background: rgba(255, 247, 228, 0.1); font-size: 19px; line-height: 1.4; }
.fb strong { display: block; font-family: var(--display); font-size: 24px; margin-bottom: 4px; }
.fb.good strong { color: var(--good); }
.fb.bad strong { color: var(--bad); }

.score { font-family: var(--display); font-weight: 800; line-height: 0.9; font-size: clamp(88px, 28vw, 150px); color: var(--sun); margin: 10px 0 0; }
.score small { font-size: 0.32em; color: var(--paper); font-weight: 600; margin-left: 10px; }
.verdict { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7vw, 34px); line-height: 1.1; margin: 14px 0 0; }

.song { margin-top: 20px; }
.song .btn { margin-top: 0; min-height: 56px; font-size: 19px; }
.songlink { display: inline-block; margin-top: 12px; color: var(--sun); font-weight: 700; font-size: 16px; text-underline-offset: 3px; }
.recap { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.recap li { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(255, 247, 228, 0.09); font-size: 17px; }
.recap .m { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #052E1B; background: var(--good); }
.recap li.ko .m { background: var(--bad); color: #3A0B03; }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

@media (prefers-reduced-motion: reduce) {
  .rec::before { animation: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="app">
  <main class="vf" aria-live="polite">
    <i></i><b></b>
    <div class="hud" aria-hidden="true"><span class="rec">REC</span><span>09/10/2026</span></div>

    <section class="screen" id="intro">
      <h1>Joyeux anniversaire Papa !</h1>
      <p class="lead">Quinze questions sur tes souvenirs, dont une qui demande deux réponses. Aucun droit de demander de l'aide à maman.</p>
      <button class="btn" id="go" type="button">Lancer le quiz</button>
      <p class="from">Préparé spécialement par ton fils.</p>
    </section>

    <section class="screen" id="play" hidden>
      <div class="bar"><button class="mini" id="back" type="button">← Retour</button><button class="mini" id="restart" type="button">↻ Nouvelle partie</button></div>
      <div class="top"><span id="count"></span><span id="pts"></span></div>
      <div class="tape" id="tape" aria-hidden="true"></div>
      <div class="q"><p id="qtext"></p></div>
      <p class="hint" id="hint" hidden></p>
      <div class="opts" id="opts"></div>
      <button class="btn" id="check" type="button" hidden disabled>Valider mes deux réponses</button>
      <div class="fb" id="fb" hidden></div>
      <button class="btn" id="next" type="button" hidden>Question suivante</button>
    </section>

    <section class="screen" id="end" hidden>
      <h2 id="etitle">Quiz terminé</h2>
      <p class="score" id="score"></p>
      <p class="verdict" id="verdict"></p>
      <div class="song" id="song">
        <button class="btn quiet" id="songbtn" type="button" aria-pressed="false">🎵 Écouter ta chanson d'anniversaire</button>
        <a class="songlink" id="songlink" href="https://music.apple.com/fr/album/joyeux-anniversaire/1651109252?i=1651109253" target="_blank" rel="noopener">Ouvrir le morceau en entier dans Apple Music</a>
      </div>
      <ul class="recap" id="recap"></ul>
      <button class="btn" id="again" type="button">Rejouer</button>
      <audio id="audio" preload="none" src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview112/v4/ab/3b/73/ab3b733f-50ee-8001-529f-f62d96698e70/mzaf_6453975761052186113.plus.aac.p.m4a"></audio>
    </section>
  </main>
</div>

    if (at >= 0) { sel.splice(at, 1); b.classList.remove("sel"); b.setAttribute("aria-pressed", "false"); }
    else {
      if (sel.length >= q.multi) { var old = sel.shift(); old.classList.remove("sel"); old.setAttribute("aria-pressed", "false"); }
      sel.push(b); b.classList.add("sel"); b.setAttribute("aria-pressed", "true");
    }
    $("check").disabled = sel.length !== q.multi;
  }
  function addPhoto(fb, q) {
    if (!q.photo) return;
    var fig = document.createElement("figure"); fig.className = "shot";
    var im = document.createElement("img"); im.src = q.photo; im.alt = q.photoAlt || ""; im.decoding = "async";
    var cap = document.createElement("figcaption"); cap.textContent = q.photoNote || "";
    fig.appendChild(im); fig.appendChild(cap); fb.appendChild(fig);
  }
  function reveal(ok, title, text) {
    var fb = $("fb");
    fb.className = "fb " + (ok ? "good" : "bad");
    fb.textContent = "";
    var st = document.createElement("strong"); st.textContent = title;
    fb.appendChild(st); fb.appendChild(document.createTextNode(text));
    addPhoto(fb, QUESTIONS[state.i]);
    fb.hidden = false;
    $("pts").textContent = state.score + " point" + (state.score > 1 ? "s" : "");
    renderTape();
    var last = state.i + 1 >= QUESTIONS.length;
    $("next").textContent = last ? "Voir mon score" : "Question suivante";
    $("next").hidden = false;
    try { $("next").focus({ preventScroll: false }); } catch (e) { /* ignoré */ }
    $("next").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function validate() {
    var q = QUESTIONS[state.i];
    if (state.locked || sel.length !== q.multi) return;
    state.locked = true;
    var goodSel = sel.filter(function (b) { return b.dataset.ok; }).length;
    var ok = goodSel === q.multi;
    state.results[state.i] = ok;
    if (ok) state.score++;
    var picked = sel.slice();
    Array.prototype.forEach.call($("opts").children, function (b) {
      b.disabled = true;
      b.classList.remove("sel");
      if (b.dataset.ok) b.classList.add("right");
      else if (picked.indexOf(b) >= 0) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    $("check").hidden = true;
    $("hint").hidden = true;
    if (ok) reveal(true, q.good, q.goodText);
    else if (goodSel === q.multi - 1) reveal(false, q.part, q.partText);
    else reveal(false, q.bad, q.badText);
  }
  function answer(btn) {
    if (state.locked) return;
    state.locked = true;
    var q = QUESTIONS[state.i], ok = !!btn.dataset.ok;
    state.results[state.i] = ok;
    if (ok) state.score++;
    Array.prototype.forEach.call($("opts").children, function (b) {
      b.disabled = true;
      if (b.dataset.ok) b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    var fb = $("fb");
    fb.className = "fb " + (ok ? "good" : "bad");
    fb.textContent = "";
    var st = document.createElement("strong"); st.textContent = ok ? q.good : q.bad;
    fb.appendChild(st);
    fb.appendChild(document.createTextNode(ok ? q.goodText : q.badText));
    addPhoto(fb, q);
    fb.hidden = false;
    $("pts").textContent = state.score + " point" + (state.score > 1 ? "s" : "");
    renderTape();
    var last = state.i + 1 >= QUESTIONS.length;
    $("next").textContent = last ? "Voir mon score" : "Question suivante";
    $("next").hidden = false;
    try { $("next").focus({ preventScroll: false }); } catch (e) { /* ignoré */ }
    $("next").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function next() {
    if (state.i + 1 >= QUESTIONS.length) { finish(); return; }
    state.i++;
    renderQuestion();
    window.scrollTo(0, 0);
  }
  function finish() {
    show("end");
    $("score").textContent = state.score;
    var sm = document.createElement("small"); sm.textContent = "sur " + QUESTIONS.length;
    $("score").appendChild(sm);
    $("verdict").textContent = verdict(state.score, QUESTIONS.length);
    var r = $("recap"); r.textContent = "";
    QUESTIONS.forEach(function (q, k) {
      var li = document.createElement("li");
      li.className = state.results[k] ? "ok" : "ko";
      var m = document.createElement("span"); m.className = "m"; m.textContent = state.results[k] ? "✓" : "✗";
      var good = q.short || q.o.filter(function (o) { return o[1]; })[0][0];
      var t = document.createElement("span"); t.textContent = good;
      li.appendChild(m); li.appendChild(t); r.appendChild(li);
    });
    if (state.score >= Math.ceil(QUESTIONS.length / 2)) confetti();
    playSong();
  }

  /* La chanson : extrait de 30 secondes fourni par Apple. Si l'appareil ou la page le bloque, il reste le lien vers Apple Music. */
  var audio = $("audio"), songFailed = false;
  function setSong(on) {
    $("songbtn").setAttribute("aria-pressed", on ? "true" : "false");
    $("songbtn").textContent = on ? "⏸ Mettre la chanson en pause" : "🎵 Écouter ta chanson d'anniversaire";
  }
  function playSong() {
    if (songFailed) return;
    try {
      audio.currentTime = 0;
      var pr = audio.play();
      if (pr && pr.then) pr.then(function () { setSong(true); }, function () { setSong(false); });
      else setSong(true);
    } catch (e) { setSong(false); }
  }
  function stopSong() { try { audio.pause(); audio.currentTime = 0; } catch (e) { /* ignoré */ } setSong(false); }
  audio.addEventListener("ended", function () { setSong(false); });
  audio.addEventListener("error", function () { songFailed = true; $("songbtn").hidden = true; });
  $("songbtn").addEventListener("click", function () { if (audio.paused) playSong(); else stopSong(); });

  /* Confettis : uniquement si l'appareil n'a pas demandé moins d'animations. */
  var raf = 0;
  function stopFx() {
    cancelAnimationFrame(raf);
    var c = $("fx"); c.getContext("2d").clearRect(0, 0, c.width, c.height);
  }
  function confetti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = $("fx"), x = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    var colors = ["#FFC93C", "#35D08A", "#FF6B57", "#FFF7E4", "#6CA0FF"], parts = [], k;
    for (k = 0; k < 130; k++) parts.push({ x: Math.random() * c.width, y: -Math.random() * c.height * 0.6, w: (6 + Math.random() * 8) * dpr, h: (10 + Math.random() * 10) * dpr, vy: (2 + Math.random() * 4) * dpr, vx: (Math.random() - 0.5) * 3 * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: colors[k % colors.length] });
    var t0 = performance.now();
    (function tick(now) {
      x.clearRect(0, 0, c.width, c.height);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
      });
      if (now - t0 < 5200) raf = requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
    })(t0);
  }

  $("go").addEventListener("click", start);
  $("restart").addEventListener("click", start);
  $("back").addEventListener("click", function () { stopFx(); stopSong(); show("intro"); });
  $("next").addEventListener("click", next);
  $("check").addEventListener("click", validate);
  $("again").addEventListener("click", function () { stopFx(); stopSong(); start(); });
  window.__quiz = { state: function () { return state; }, QUESTIONS: QUESTIONS };
})();
</script>
